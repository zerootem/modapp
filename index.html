    <link rel="stylesheet" crossorigin href="/modapp/assets/app.css?v=mwv9a96h">
  </head>
  <body>
    <div id="root"></div>
    <script id="mw-recovery">
      (function () {
        var KEY = 'mw-recovery-try';
        function reloadFresh() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          try {
            var u = new URL(location.href);
            u.searchParams.set('fresh', Date.now().toString(36));
            location.replace(u.toString());
          } catch (e) { location.reload(); }
        }
        function booted() {
          var root = document.getElementById('root');
          return !!(root && root.firstChild);
        }
        var s = document.querySelector('script[type="module"]');
        if (s) s.addEventListener('error', reloadFresh);
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') reloadFresh();
        }, true);
        setTimeout(function () { if (!booted()) reloadFresh(); }, 12000);
        setInterval(function () {
          if (!booted()) return;
          try { sessionStorage.removeItem(KEY); } catch (e) {}
        }, 2000);
      })();
    </script>
  </body>
</html>
